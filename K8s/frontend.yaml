apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: muhammadmuzamil1/frontend:v6

          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 100m
              memory: 256Mi

---

apiVersion: v1
kind: Service

metadata:
  name: frontend-service

spec:
  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081

  type: NodePort
