apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: muhammadmuzamil1/api-gateway:v2

          ports:
            - containerPort: 8083
          
          resources:
            requests:
              memory: 256Mi
              cpu: 200m

            limits:
              memory: 512Mi
              cpu: 500m

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081

            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081

            failureThreshold: 30
            periodSeconds: 10

          
---

apiVersion: v1
kind: Service

metadata:
  name: api-gateway-service

spec:
  selector:
    app: api-gateway

  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083

  type: NodePort
