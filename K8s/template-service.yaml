apiVersion: apps/v1
kind: Deployment

metadata:
  name: template-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: template-service

  template:
    metadata:
      labels:
        app: template-service

    spec:
      containers:
        - name: template-service
          image: muhammadmuzamil1/template-service:v2

          ports:
            - containerPort: 8080
          
          resources:
            requests:
              memory: 256Mi
              cpu: 200m

            limits:
              memory: 768Mi
              cpu: 700m
          
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081

            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081

            failureThreshold: 30
            periodSeconds: 10

---

apiVersion: v1
kind: Service

metadata:
  name: template-service

spec:
  selector:
    app: template-service

  ports:
    - port: 8080
      targetPort: 8080

  type: ClusterIP
