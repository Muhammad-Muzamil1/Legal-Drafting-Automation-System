apiVersion: apps/v1
kind: Deployment

metadata:
  name: draft-service

spec:
  replicas: 3

  selector:
    matchLabels:
      app: draft-service

  template:
    metadata:
      labels:
        app: draft-service

    spec:
      containers:
        - name: draft-service
          image: muhammadmuzamil1/draft-service:v2

          ports:
            - containerPort: 8081
          
          resources:
            requests:
              memory: 256Mi
              cpu: 200m

            limits:
              memory: 768Mi
              cpu: 700m
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081

            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081

            failureThreshold: 30
            periodSeconds: 10

          

---

apiVersion: v1
kind: Service

metadata:
  name: draft-service

spec:
  selector:
    app: draft-service

  ports:
    - port: 8081
      targetPort: 8081

  type: ClusterIP
