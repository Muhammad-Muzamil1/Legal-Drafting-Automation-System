apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: document-service-hpa
  namespace: ldas

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: document-service

  minReplicas: 1
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory

        target:
          type: Utilization
          averageUtilization: 80
